# HC LABS API — konfigurasi Worker
# Dipakai oleh Cloudflare Workers Builds saat repo GitHub di-connect
# (Workers & Pages → hclabsbackend → Settings → Build → Connect to Git).
#
# File yang wajib ikut di-push ke repo: worker.js DAN fal-client.js
# (worker.js meng-import fal-client.js — Cloudflare Workers Builds
# otomatis bundle keduanya, tidak perlu konfigurasi tambahan).

name = "hc-labs-api"
main = "worker.js"
compatibility_date = "2026-07-30"

[[kv_namespaces]]
binding = "hc_kv"
id = "a02fdfe6cc734c49a0f47549d090d477"
# Cara cari ID: dashboard Cloudflare → Storage & Databases → KV →
# klik namespace hc_kv yang sudah ada → copy "Namespace ID" di situ.
# JANGAN buat namespace baru — pakai yang sudah ada supaya data lisensi
# existing tidak hilang.

[[d1_databases]]
binding = "HC_DB"
database_name = "hclabs-core"
database_id = "8f10f3a1-0542-4b4b-a68a-57ad66cadc7a"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "HC_ASSETS"
bucket_name = "hc-labs-assets"

# ─────────────────────────────────────────────
# SECRETS — JANGAN pernah ditaruh di file ini (file ini masuk ke Git).
# Set lewat salah satu cara berikut setelah repo ter-connect:
#   1. Dashboard: Workers & Pages → hclabsbackend → Settings → Variables and Secrets
#   2. CLI dari Acode: wrangler secret put FAL_KEY
#                       wrangler secret put KOBOLLM_API_KEY
#                       wrangler secret put ZAI_API_KEY
#                       wrangler secret put ADMIN_SECRET
#
# Yang dibutuhkan:
#   FAL_KEY       -> API key dari https://fal.ai/dashboard/keys
#   LLM_PROVIDER  -> koboi (default sementara) atau zai
#   KOBOLLM_BASE_URL -> base URL OpenAI-compatible Koboi, tanpa /chat/completions
#   KOBOLLM_API_KEY  -> API key Koboi LLM
#   KOBOLLM_MODEL    -> model Koboi yang digunakan
#   ZAI_API_KEY    -> API key Z.ai Open Platform
#   ZAI_BRAIN_MODEL -> model Z.ai untuk endpoint Brain (mis. glm-5.3-flash)
#   ADMIN_SECRET  -> secret bebas untuk endpoint /api/admin/bulk-import
#
# Catatan: IMAGE_PROVIDER / VIDEO_PROVIDER (var lama era DeAPI) sudah tidak
# dipakai kode baru — boleh dihapus dari Settings → Variables kalau mau beres-beres.
# ─────────────────────────────────────────────
